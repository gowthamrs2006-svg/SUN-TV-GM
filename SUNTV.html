<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Sun TV Live</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #17171e;
    }

    .logo { font-size: 22px; font-weight: 700; }
    .live { color: #ff3434; font-size: 13px; font-weight: 700; }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .channel-logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #292935;
      color: #ffbd35;
      font-weight: 700;
    }

    .channel-name { font-size: 20px; font-weight: 700; }
    .channel-subtitle { color: #aaa; font-size: 13px; margin-top: 4px; }

    .video-container {
      width: 100%;
      background: #000;
      overflow: hidden;
      border-radius: 10px;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000;
    }

    /* Fullscreen video fills the display. Some picture edges may be cropped. */
    video:fullscreen {
      width: 100vw;
      height: 100vh;
      max-height: none;
      aspect-ratio: auto;
      object-fit: cover;
      background: #000;
    }

    video:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      object-fit: cover;
      background: #000;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #191920;
      color: #d0d0d8;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.error { color: #ffaaaa; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      min-width: 135px;
      border: 0;
      border-radius: 8px;
      padding: 13px;
      background: #e52b32;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary { background: #292934; }

    footer {
      padding: 20px 12px;
      text-align: center;
      color: #888894;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      header { padding: 12px 14px; }
      main { padding: 12px 8px; }
      .logo { font-size: 20px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">LIVE TV</div>
    <div class="live">● LIVE</div>
  </header>

  <main>
    <div class="channel-info">
      <div class="channel-logo">SUN</div>
      <div>
        <div class="channel-name">Sun TV</div>
        <div class="channel-subtitle">Live Television</div>
      </div>
    </div>

    <div class="video-container">
      <video id="video" controls autoplay muted playsinline preload="auto"></video>
    </div>

    <div id="status" class="status">Connecting to live stream...</div>

    <div class="actions">
      <button id="playButton">▶ Play Live TV</button>
      <button id="soundButton" class="secondary">🔊 Enable Sound</button>
      <button id="fullscreenButton" class="secondary">⛶ Full Screen</button>
    </div>
  </main>

  <footer>Live TV Player</footer>

  <script>
    // Fixed stream URL. Change it here only if you have an authorized replacement.
    const STREAM_URL =
      "https://d2px1d6ssc60fw.cloudfront.net/SunTV/SunTV-HDR10-IN-index.m3u8";

    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const playButton = document.getElementById("playButton");
    const soundButton = document.getElementById("soundButton");
    const fullscreenButton = document.getElementById("fullscreenButton");

    let hls = null;

    function setStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle("error", isError);
    }

    function startStream() {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();
      setStatus("Connecting to Sun TV...");

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().then(() => {
            setStatus("Stream connected. Sun TV is playing.");
          }).catch(() => {
            setStatus("Tap Play Live TV to start playback.");
          });
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            setStatus(
              "Could not play this stream. It may be unavailable or the server may block browser playback.",
              true
            );
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = STREAM_URL;
        video.play().then(() => {
          setStatus("Sun TV is playing.");
        }).catch(() => {
          setStatus("Tap Play Live TV to start playback.");
        });
      } else {
        setStatus("This browser does not support HLS playback.", true);
      }
    }

    playButton.addEventListener("click", () => {
      if (video.error) {
        startStream();
      } else {
        video.play().then(() => {
          setStatus("Sun TV is playing.");
        }).catch(() => {
          setStatus("Playback blocked. Check whether the stream is available.", true);
        });
      }
    });

    soundButton.addEventListener("click", () => {
      video.muted = !video.muted;
      soundButton.textContent = video.muted ? "🔊 Enable Sound" : "🔇 Mute Sound";
      if (!video.muted) {
        video.play().catch(() => setStatus("Tap Play Live TV, then enable sound."));
      }
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        } else {
          setStatus("Fullscreen is not supported in this browser.", true);
        }
      } catch (error) {
        setStatus("Tap the video player fullscreen control instead.", true);
      }
    });

    startStream();
  </script>
</body>
</html>
